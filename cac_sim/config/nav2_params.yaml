# Nav2 configuration for the CAC rover.
#
# Clearance: Smac only rejects poses whose footprint touches a LETHAL cell, so
# footprint_padding is the only hard margin to boulders and detected craters.
# With 0.02 m, planned paths passed 1.7-4 cm from boulders and 2.3 cm from a
# partly seen crater (tools/planner_route_test.py, seed 10). 0.06 m keeps every
# validated layout plannable (arena_layout guarantees 0.10 m per side); the
# boundary keep-out band shrank by the same 4 cm (localization.keepout_band),
# so the margin to the walls is unchanged at 0.17 m. Inflation decays slower
# (cost_scaling_factor 1.5) and the planner weighs cost more (cost_penalty 4),
# so a wider route wins over a narrow gap when one exists.
#
# Geometry: the rover is planned and checked as its real rectangle, not a circle.
# `footprint` below MUST equal robot.footprint_* in config/arena_params.yaml
# (test/test_consistency.py checks it). Inscribed radius = half width (0.37 m);
# circumscribed radius = farthest corner (~0.76 m). Inflation (0.85 m) reaches
# past the circumscribed radius so the planner's cost gradient keeps the swept
# turning circle off obstacles without closing passages the rover fits through.
#
# Localization: map == arena frame, provided by marker_localizer (start-zone
# ArUco markers) -- there is no SLAM map. The global costmap's extent comes from
# the a-priori arena boundary grid (/arena_boundary), so the whole arena is
# plannable from the first goal. Wall LiDAR returns never reach any layer
# (sources use /scan_filtered, see cac_sim/wall_filter.py).
#
# The `<NAV2_SMAC_SHARE>` token is replaced with the nav2_smac_planner share
# directory by launch/cac_sim.launch.py, which writes the resolved copy into the
# run directory.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # Nav2's 20 ms default made BT action-ack waits time out under simulation
    # load, ending goals with error_code 0 (seen in the baseline diagnosis).
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    # Nav2's default replanning + recovery BT without the Spin recovery (see the
    # XML header). <CAC_SIM_SHARE> is resolved by the launch file.
    default_nav_to_pose_bt_xml: "<CAC_SIM_SHARE>/config/behavior_trees/navigate_to_pose_no_spin.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 20.0

    # Tighter than the mission's arrival check (0.30 m / 0.60 rad) so a goal
    # Nav2 accepts is also one the mission accepts.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.40
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      transform_tolerance: 0.3
      # 0.20 m/s: a shallow crater is confirmed only ~1.5 m ahead (seed 12), so
      # speed sets the reaction distance; ~10 detector frames per metre.
      desired_linear_vel: 0.30
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      # Skid steer turns in place: rotate toward the path / final heading
      # instead of arcing wide near obstacles.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 1.5
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.66, 0.37], [0.66, -0.37], [-0.47, -0.37], [-0.47, 0.37]]"
      footprint_padding: 0.06
      initial_transform_timeout: 300.0
      plugins: ["boundary_layer", "obstacle_layer", "crater_layer", "inflation_layer"]
      boundary_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /arena_boundary
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          # wall_filter.py turns wall returns into +inf; treating inf as a
          # no-hit ray lets those beams clear stale cells (e.g. phantom walls
          # marked while localization was off) instead of being dropped.
          inf_is_valid: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
      crater_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: craters
        craters:
          topic: /crater_cells
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          clearing: false        # nothing may erase a detected crater
          marking: true
          obstacle_max_range: 20.0   # cells are published in map frame
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.85
        cost_scaling_factor: 3.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 4.0     # newly confirmed crater cells reach the planner sooner
      publish_frequency: 1.0
      resolution: 0.05
      footprint: "[[0.66, 0.37], [0.66, -0.37], [-0.47, -0.37], [-0.47, 0.37]]"
      footprint_padding: 0.06
      track_unknown_space: false
      initial_transform_timeout: 300.0
      plugins: ["boundary_layer", "obstacle_layer", "crater_layer", "inflation_layer"]
      boundary_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /arena_boundary
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          # wall_filter.py turns wall returns into +inf; treating inf as a
          # no-hit ray lets those beams clear stale cells (e.g. phantom walls
          # marked while localization was off) instead of being dropped.
          inf_is_valid: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
      crater_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: craters
        craters:
          topic: /crater_cells
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          clearing: false
          marking: true
          obstacle_max_range: 20.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.85
        cost_scaling_factor: 3.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    # State-lattice planner with differential-drive primitives (includes turning
    # in place). Unlike NavFn it collision-checks the full rectangular footprint
    # at every pose, so it never plans through a gap the body cannot turn in.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "<NAV2_SMAC_SHARE>/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.10
      non_straight_penalty: 1.15
      cost_penalty: 1.5
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    # Spin recovery at the mission's localization-spin rate. At Nav2's default
    # (1.0 rad/s, 3.2 rad/s^2) the skid-steer rover slid ~0.1 m/s sideways while
    # odometry saw a pure rotation: 0.17-0.27 m of unseen drift per spin, ending
    # in a boulder contact (seed 10 rerun, suite_results/seed10_fixed). Measured
    # slip at <= 0.35 rad/s: median 0.002-0.014 m/s.
    max_rotational_vel: 0.35
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    # cmd_vel_smoothed -> cmd_vel (nav2 defaults). Last line of defence against
    # SENSED obstacles (boulders); uses /scan_filtered, so it deliberately does
    # not react to walls (rulebook) -- wall clearance comes from the boundary layer.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan_filtered"

docking_server:
  ros__parameters:
    use_sim_time: true
    base_frame: "base_footprint"
    fixed_frame: "odom"
    # navigation_launch.py always starts docking_server; an empty plugin list
    # crashes it, so one stock plugin is declared. Nothing uses docking.
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'

# lifecycle_manager_navigation's autostart/node_names come from nav2_bringup's
# navigation_launch.py itself; values here would be ignored.
